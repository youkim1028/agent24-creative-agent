<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeckForge X — Raw Tool Events</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="trace-body">
    <main class="trace-shell">
      <header class="trace-header">
        <div>
          <p class="eyebrow">SECOND SCREEN / UNMODIFIED PAYLOADS</p>
          <h1>tool_call / tool_result</h1>
          <p>
            GPT 역할 호출에 실제로 전달한 요청 객체와 모델이 돌려준 출력, Grok X Search의 output
            item, YouTube 영상·댓글 및 Hacker News 검색 요청과 정규화 결과를 요약하거나 고치지 않고 그대로 출력합니다.
            긴 payload는 잘라내지 않고 카드 안에서 스크롤됩니다.
          </p>
        </div>
        <div class="trace-controls">
          <span id="stream-state" class="connection-badge live"><i></i><span>연결 중</span></span>
          <button id="clear-events" class="secondary-button" type="button">화면 지우기</button>
          <button id="fullscreen" class="secondary-button" type="button">전체 화면</button>
        </div>
      </header>
      <div class="trace-legend">
        <span><i class="dot call"></i>tool_call</span>
        <span><i class="dot outcome"></i>tool_result</span>
        <span><i class="dot status"></i>status</span>
      </div>
      <section id="event-list" class="event-list" aria-live="polite">
        <div id="waiting" class="trace-waiting">DeckForge X 이벤트를 기다리는 중…</div>
      </section>
    </main>
    <script type="module" src="/trace.js"></script>
  </body>
</html>
