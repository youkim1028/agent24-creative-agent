<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1330" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="1330" fill="#ffffff"/>

  <!-- ═══════════ Input ═══════════ -->
  <rect x="330" y="36" width="280" height="58" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="470" y="60" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">User Brief</text>
  <text x="470" y="80" text-anchor="middle" font-size="10" fill="#555">slide count · language · optional uploads / official URLs</text>

  <!-- split arrows -->
  <path d="M 470 94 L 470 112 L 245 112 L 245 158" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 470 94 L 470 112 L 695 112 L 695 158" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══════════ Left lane: evaluation ═══════════ -->
  <rect x="50" y="132" width="390" height="474" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="66" y="152" font-size="10.5" fill="#888" letter-spacing="2">EVALUATION LANE — COMMUNITY RESEARCH</text>

  <rect x="90" y="166" width="310" height="56" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="245" y="188" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Research Planner</text>
  <text x="245" y="206" text-anchor="middle" font-size="9.5" fill="#555">GPT · targets the AI-ness of AI decks, never the brief's subject</text>

  <path d="M 245 222 L 245 252" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="90" y="256" width="310" height="84" fill="#ffffff" stroke="#444" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="245" y="280" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Community Retrieval</text>
  <text x="245" y="299" text-anchor="middle" font-size="9.5" fill="#555">X (Grok search) · YouTube Data API · Hacker News</text>
  <text x="245" y="316" text-anchor="middle" font-size="9.5" fill="#555">complaint-signal ranking · off-topic filter · daily quotas</text>

  <!-- GCS cache -->
  <path d="M 200 340 L 200 364" fill="none" stroke="#666" stroke-width="1" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
  <rect x="110" y="368" width="180" height="44" fill="#ffffff" stroke="#444" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="200" y="386" text-anchor="middle" font-size="11" fill="#111">GCS research memory</text>
  <text x="200" y="402" text-anchor="middle" font-size="9" fill="#555">keyed by brief seed · TTL</text>

  <path d="M 340 340 L 340 442" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="90" y="446" width="310" height="56" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="245" y="468" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Evidence Analyst</text>
  <text x="245" y="486" text-anchor="middle" font-size="9.5" fill="#555">GPT · transforms complaints into checkable criteria</text>

  <path d="M 245 502 L 245 524" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="90" y="528" width="310" height="52" fill="#ffffff" stroke="#111" stroke-width="2.4"/>
  <text x="245" y="549" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">AI-ness Rubric</text>
  <text x="245" y="567" text-anchor="middle" font-size="9.5" fill="#555">evaluation signal only — never deck content</text>

  <!-- ═══════════ Right lane: content ═══════════ -->
  <rect x="500" y="132" width="390" height="474" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="516" y="152" font-size="10.5" fill="#888" letter-spacing="2">CONTENT LANE — BRIEF ONLY</text>

  <rect x="540" y="166" width="310" height="56" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="695" y="188" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Narrative Architect</text>
  <text x="695" y="206" text-anchor="middle" font-size="9.5" fill="#555">GPT · one claim per slide · language-native title conventions</text>

  <path d="M 695 222 L 695 248" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="540" y="252" width="310" height="42" fill="#ffffff" stroke="#111" stroke-width="2.4"/>
  <text x="695" y="278" text-anchor="middle" font-size="12" fill="#111">NarrativeSpec (3–5 slides)</text>

  <path d="M 695 294 L 695 326" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="540" y="330" width="310" height="60" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="695" y="352" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Art Director</text>
  <text x="695" y="370" text-anchor="middle" font-size="9.5" fill="#555">theme · shape emblem · per-slide layout directives</text>
  <text x="695" y="384" text-anchor="middle" font-size="9" fill="#777">contract-checked, one repair pass</text>

  <rect x="580" y="428" width="230" height="40" fill="#ffffff" stroke="#444" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="695" y="445" text-anchor="middle" font-size="10.5" fill="#111">Recent-design fingerprints</text>
  <text x="695" y="459" text-anchor="middle" font-size="9" fill="#555">theme / emblem / layout anti-repetition</text>
  <path d="M 620 428 L 620 390" fill="none" stroke="#666" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <path d="M 770 390 L 770 500" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="540" y="504" width="310" height="42" fill="#ffffff" stroke="#111" stroke-width="2.4"/>
  <text x="695" y="530" text-anchor="middle" font-size="12" fill="#111">VisualSystemSpec</text>

  <!-- rubric → art director (dashed evaluation signal) -->
  <path d="M 400 554 L 470 554 L 470 360 L 536 360" fill="none" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- merge to spine -->
  <path d="M 695 546 L 695 614 L 470 614 L 470 644" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══════════ Spine ═══════════ -->
  <rect x="280" y="648" width="380" height="64" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="672" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Visual Asset Resolution (code)</text>
  <text x="470" y="690" text-anchor="middle" font-size="9.5" fill="#555">Pexels / Unsplash under quotas · uploads · official allowlist</text>
  <text x="470" y="704" text-anchor="middle" font-size="9.5" fill="#555">charts &amp; diagrams stay native-generation plans</text>

  <path d="M 470 712 L 470 740" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="280" y="744" width="380" height="60" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="766" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Deck Composer</text>
  <text x="470" y="784" text-anchor="middle" font-size="9.5" fill="#555">GPT writes copy only — code binds directives, images, citations</text>

  <path d="M 470 804 L 470 832" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="280" y="836" width="380" height="60" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="858" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Deterministic Validators + Evaluator (code)</text>
  <text x="470" y="876" text-anchor="middle" font-size="9.5" fill="#555">layout contracts · community-leak gate · density &amp; title rules</text>

  <path d="M 470 896 L 470 924" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="280" y="928" width="380" height="64" fill="#ececec" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="950" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Independent Critic</text>
  <text x="470" y="968" text-anchor="middle" font-size="9.5" fill="#555">judges with the rubric · two bars: excellent AND not AI-ish</text>
  <text x="470" y="982" text-anchor="middle" font-size="9" fill="#777">verdict → one bounded repair, then recheck</text>

  <!-- rubric → critic (dashed evaluation signal) -->
  <path d="M 245 580 L 245 960 L 276 960" fill="none" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="228" y="770" text-anchor="middle" font-size="9" fill="#777" transform="rotate(-90 228 770)">evaluation signal</text>

  <!-- repair loop (right side) -->
  <path d="M 660 960 L 900 960 L 900 680 L 664 680" fill="none" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <path d="M 900 774 L 664 774" fill="none" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="912" y="820" text-anchor="middle" font-size="9" fill="#777" transform="rotate(-90 912 820)">repair ×1: image re-selection · copy repair</text>

  <path d="M 470 992 L 470 1020" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="280" y="1024" width="380" height="56" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="1046" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Fail-closed Quality Gate</text>
  <text x="470" y="1064" text-anchor="middle" font-size="9.5" fill="#555">blocked → deck spec + blockers returned, no file written</text>

  <path d="M 470 1080 L 470 1108" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="280" y="1112" width="380" height="60" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="1134" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">PptxGenJS Renderer (code)</text>
  <text x="470" y="1152" text-anchor="middle" font-size="9.5" fill="#555">4 design systems · native charts, diagrams, shape emblem · image hash check</text>

  <path d="M 470 1172 L 470 1200" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="330" y="1204" width="280" height="44" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="470" y="1231" text-anchor="middle" font-size="12.5" fill="#111" font-weight="bold">PPTX + JSON artifacts</text>

  <!-- ═══════════ Legend ═══════════ -->
  <g font-size="9.5" fill="#333">
    <rect x="60" y="1272" width="18" height="13" fill="#ececec" stroke="#111" stroke-width="1"/>
    <text x="84" y="1282">LLM role (GPT)</text>
    <rect x="180" y="1272" width="18" height="13" fill="#ffffff" stroke="#111" stroke-width="1"/>
    <text x="204" y="1282">Deterministic code</text>
    <rect x="320" y="1272" width="18" height="13" fill="#ffffff" stroke="#444" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="344" y="1282">External service / store</text>
    <rect x="480" y="1272" width="18" height="13" fill="#ffffff" stroke="#111" stroke-width="2.2"/>
    <text x="504" y="1282">Typed contract artifact</text>
    <line x1="640" y1="1278" x2="672" y2="1278" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="680" y="1282">data flow</text>
    <line x1="750" y1="1278" x2="782" y2="1278" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
    <text x="790" y="1282">evaluation / repair</text>
  </g>
</svg>
